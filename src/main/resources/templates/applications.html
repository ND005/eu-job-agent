<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Applied Jobs Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <h2>📋 Application Tracker</h2>
    <table class="table table-bordered align-middle mt-3">
        <thead class="table-secondary">
            <tr>
                <th>Job Title</th>
                <th>Company</th>
                <th>Applied Date</th>
                <th>Template Used</th>
                <th>Current Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="app : ${applications}">
                <td th:text="${app.jobPosting.title}">Title</td>
                <td th:text="${app.jobPosting.company}">Company</td>
                <td th:text="${app.appliedDate}">2026-08-09</td>
                <td th:text="${app.templateUsed}">Standard Resume</td>
                <td>
                    <form th:action="@{/applications/update-status}" method="post" class="d-flex">
                        <input type="hidden" name="appId" th:value="${app.id}">
                        <select name="status" class="form-select form-select-sm me-2" onchange="this.form.submit()">
                            <option th:each="s : ${statuses}" 
                                    th:value="${s}" 
                                    th:text="${s}" 
                                    th:selected="${s == app.status}"></option>
                        </select>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
