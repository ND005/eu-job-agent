<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <!-- Metric Cards -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <h5 class="card-title">Total Jobs Scraped</h5>
                    <h2 class="card-text" th:text="${totalScraped}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title">Applied Jobs</h5>
                    <h2 class="card-text" th:text="${totalApplied}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-info">
                <div class="card-body">
                    <h5 class="card-title">Replies Received</h5>
                    <h2 class="card-text" th:text="${totalReplies}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <h3>All Discovered Listings</h3>
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Title</th>
                <th>Company</th>
                <th>Location</th>
                <th>Source</th>
                <th>Match Score</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="job : ${jobs}">
                <td th:text="${job.title}">Senior SDET</td>
                <td th:text="${job.company}">Company</td>
                <td th:text="${job.location}">Germany</td>
                <td><span class="badge bg-secondary" th:text="${job.sourcePortal}">Indeed DE</span></td>
                <td><span class="badge bg-success" th:text="${job.matchScore + '%'}">85%</span></td>
                <td>
                    <a th:href="${job.jobUrl}" target="_blank" class="btn btn-sm btn-outline-primary">View Listing</a>
                    <form th:action="@{/applications/track}" method="post" class="d-inline" th:if="${job.jobApplication == null}">
                        <input type="hidden" name="jobId" th:value="${job.id}">
                        <button type="submit" class="btn btn-sm btn-success">+ Mark Applied</button>
                    </form>
                    <span th:if="${job.jobApplication != null}" class="badge bg-info text-dark">Tracked</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
